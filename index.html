<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HRSA App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            text-align: center;
            padding: 50px;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 600px;
            margin: auto;
        }
        h1 { color: #17365D; }
        .btn {
            background-color: #1F4E78;
            color: white;
            border: none;
            padding: 15px 20px;
            margin: 10px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }
        .btn-back { background-color: #70AD47; }
        .hidden { display: none; }
        input {
            padding: 10px;
            margin: 5px;
            width: 80%;
            font-size: 16px;
        }
        ul { text-align: left; }
    </style>
</head>
<body>

    <!-- MAIN MENU -->
    <div id="mainMenu" class="card">
        <h1>HRSA Master App</h1>
        <p>Please select a system to open:</p>
        <button class="btn" onclick="showScreen('attendanceScreen')">1. Attendance Tracker</button>
        <button class="btn" onclick="showScreen('contractScreen')">2. Contract Tracker</button>
    </div>

    <!-- ATTENDANCE TRACKER MENU -->
    <div id="attendanceScreen" class="card hidden">
        <h1>Attendance Tracker</h1>
        <button class="btn" onclick="showScreen('employeeDbScreen')">👥 Employee Database</button>
        <button class="btn">📅 Monthly Attendance</button>
        <button class="btn">🏆 Leaderboard</button>
        <br><br>
        <button class="btn btn-back" onclick="showScreen('mainMenu')">⬅ Back to Main Menu</button>
    </div>

    <!-- EMPLOYEE DATABASE SCREEN (NEW!) -->
    <div id="employeeDbScreen" class="card hidden">
        <h1>Employee Database</h1>
        <p>Add a new employee below:</p>
        
        <input type="text" id="empId" placeholder="Employee ID (e.g. 001)">
        <input type="text" id="empName" placeholder="Employee Name">
        <input type="text" id="empRole" placeholder="Designation (e.g. Manager)">
        <button class="btn" onclick="saveEmployee()">Save Employee</button>
        
        <h3>Saved Employees:</h3>
        <ul id="employeeList"></ul>

        <br><br>
        <button class="btn btn-back" onclick="showScreen('attendanceScreen')">⬅ Back to Attendance</button>
    </div>

    <!-- CONTRACT TRACKER SCREEN -->
    <div id="contractScreen" class="card hidden">
        <h1>Contract Tracker</h1>
        <p><em>We are building this bit by bit. Coming soon!</em></p>
        <br><br>
        <button class="btn btn-back" onclick="showScreen('mainMenu')">⬅ Back to Main Menu</button>
    </div>

    <!-- THE APP LOGIC -->
    <script>
        // This switches the screens
        function showScreen(screenName) {
            document.getElementById('mainMenu').classList.add('hidden');
            document.getElementById('attendanceScreen').classList.add('hidden');
            document.getElementById('contractScreen').classList.add('hidden');
            document.getElementById('employeeDbScreen').classList.add('hidden');
            
            document.getElementById(screenName).classList.remove('hidden');
        }

        // This saves the employee to your browser's memory and shows it in a list
        function saveEmployee() {
            let id = document.getElementById('empId').value;
            let name = document.getElementById('empName').value;
            let role = document.getElementById('empRole').value;

            if (id === "" || name === "") {
                alert("Please enter an ID and a Name!");
                return;
            }

            // Create a list item and add it to the screen
            let list = document.getElementById('employeeList');
            let newItem = document.createElement('li');
            newItem.innerText = id + " - " + name + " (" + role + ")";
            list.appendChild(newItem);

            // Clear the boxes for the next person
            document.getElementById('empId').value = "";
            document.getElementById('empName').value = "";
            document.getElementById('empRole').value = "";
        }
    </script>
</body>
</html>
