<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HRSA App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            text-align: center;
            padding: 50px;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 600px;
            margin: auto;
        }
        h1 { color: #17365D; }
        .btn {
            background-color: #1F4E78;
            color: white;
            border: none;
            padding: 15px 20px;
            margin: 10px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }
        .btn-back { background-color: #70AD47; }
        .btn-danger { background-color: #c0392b; font-size: 12px; padding: 5px 10px; margin-left: 10px; }
        .hidden { display: none; }
        input {
            padding: 10px;
            margin: 5px;
            width: 80%;
            font-size: 16px;
        }
        ul { text-align: left; list-style-type: none; padding: 0; }
        li {
            background: #eef2f5;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>

    <!-- MAIN MENU -->
    <div id="mainMenu" class="card">
        <h1>HRSA Master App</h1>
        <p>Please select a system to open:</p>
        <button class="btn" onclick="showScreen('attendanceScreen')">1. Attendance Tracker</button>
        <button class="btn" onclick="showScreen('contractScreen')">2. Contract Tracker</button>
    </div>

    <!-- ATTENDANCE TRACKER MENU -->
    <div id="attendanceScreen" class="card hidden">
        <h1>Attendance Tracker</h1>
        <button class="btn" onclick="showScreen('employeeDbScreen')">👥 Employee Database</button>
        <button class="btn">📅 Monthly Attendance</button>
        <button class="btn">🏆 Leaderboard</button>
        <br><br>
        <button class="btn btn-back" onclick="showScreen('mainMenu')">⬅ Back to Main Menu</button>
    </div>

    <!-- EMPLOYEE DATABASE SCREEN -->
    <div id="employeeDbScreen" class="card hidden">
        <h1>Employee Database</h1>
        <p>Add a new employee below:</p>
        
        <input type="text" id="empId" placeholder="Employee ID (e.g. 001)">
        <input type="text" id="empName" placeholder="Employee Name">
        <input type="text" id="empRole" placeholder="Designation (e.g. Manager)">
        <br>
        <button class="btn" onclick="saveEmployee()">Save Employee</button>
        
        <h3>Saved Employees:</h3>
        <ul id="employeeList"></ul>

        <br><br>
        <button class="btn btn-back" onclick="showScreen('attendanceScreen')">⬅ Back to Attendance</button>
    </div>

    <!-- CONTRACT TRACKER SCREEN -->
    <div id="contractScreen" class="card hidden">
        <h1>Contract Tracker</h1>
        <p><em>We are building this bit by bit. Coming soon!</em></p>
        <br><br>
        <button class="btn btn-back" onclick="showScreen('mainMenu')">⬅ Back to Main Menu</button>
    </div>

    <!-- SCRIPT WITH LOCAL STORAGE -->
    <script>
        function showScreen(screenName) {
            document.getElementById('mainMenu').classList.add('hidden');
            document.getElementById('attendanceScreen').classList.add('hidden');
            document.getElementById('contractScreen').classList.add('hidden');
            document.getElementById('employeeDbScreen').classList.add('hidden');
            
            document.getElementById(screenName).classList.remove('hidden');
        }

        // Get employees from permanent storage, or return an empty list
        function getStoredEmployees() {
            let data = localStorage.getItem('hrsa_employees');
            return data ? JSON.parse(data) : [];
        }

        // Display all stored employees on the screen
        function renderEmployees() {
            let employees = getStoredEmployees();
            let list = document.getElementById('employeeList');
            list.innerHTML = '';

            employees.forEach((emp, index) => {
                let li = document.createElement('li');
                li.innerHTML = `
                    <span><strong>${emp.id}</strong> - ${emp.name} (${emp.role})</span>
                    <button class="btn btn-danger" onclick="deleteEmployee(${index})">Delete</button>
                `;
                list.appendChild(li);
            });
        }

        // Save a new employee to permanent storage
        function saveEmployee() {
            let id = document.getElementById('empId').value.trim();
            let name = document.getElementById('empName').value.trim();
            let role = document.getElementById('empRole').value.trim();

            if (!id || !name) {
                alert("Please enter an ID and a Name!");
                return;
            }

            let employees = getStoredEmployees();
            employees.push({ id, name, role });
            localStorage.setItem('hrsa_employees', JSON.stringify(employees));

            document.getElementById('empId').value = '';
            document.getElementById('empName').value = '';
            document.getElementById('empRole').value = '';

            renderEmployees();
        }

        // Remove an employee from permanent storage
        function deleteEmployee(index) {
            let employees = getStoredEmployees();
            employees.splice(index, 1);
            localStorage.setItem('hrsa_employees', JSON.stringify(employees));
            renderEmployees();
        }

        // Load employees automatically when the page opens
        window.onload = renderEmployees;
    </script>
</body>
</html>
