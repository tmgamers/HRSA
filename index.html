<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HRSA Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            text-align: center;
            padding: 50px;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 600px;
            margin: auto;
        }
        h1 { color: #17365D; }
        .btn {
            background-color: #1F4E78;
            color: white;
            border: none;
            padding: 15px 20px;
            margin: 10px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>HRSA Attendance App</h1>
        <p>Welcome to your new dashboard!</p>
        
        <button class="btn">Employee Database</button>
        <button class="btn">Monthly Attendance</button>
        <button class="btn">Leaderboard</button>
    </div>

</body>
</html>
